version: "2"

run:
  go: "1.26"
  env:
    - GOEXPERIMENT=jsonv2

linters:
  default: standard
  enable:
    - revive
    - errcheck
    - gocritic
    - gosec
    - bodyclose
    - misspell
    - unconvert
    - prealloc

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
