# BuildFlow configuration - go-datastar
#
# The repo's canonical gates are the flake apps (nix run .#test / .#lint-ci /
# .#erraudit) plus the CI workflow; this file only tunes BuildFlow's
# broader-than-repo toolset so it stays green without masking real findings.
#
# license-check environment contract: run BuildFlow inside the devshell
# (`nix develop -c buildflow ...`). The devshell provides go-licenses and,
# critically, pins GOTOOLCHAIN=local with a real GOROOT; in a plain user
# shell GOTOOLCHAIN=auto switches to the toolchain cache
# (/mnt/buildcache/go-mod/golang.org/toolchain@...), and go-licenses stdlib
# detection (isStdLib compares package paths against the GOROOT the binary
# was built/run with) misaligns, so every stdlib package errors with "does
# not have module info" (adjacent to google/go-licenses#128). That was the
# license-check x4+ failure loop closed 2026-10-01.

build_mode: full

# Skipped steps, each a deliberate, documented decision:
#
# go-structure-linter: wants a cmd/internal/pkg layout. This repo is
#   DELIBERATELY a flat single package (AGENTS.md "Module Structure"; ADR 002
#   multi-module split; module_boundary_test.go enforces the boundaries).
#
# eslint-check / eslint-fix: the only JavaScript is the vendored upstream
#   DataStar client bundle; there is no first-party JS/TS to configure for.
#   (BuildFlow now also auto-defers eslint when no eslint config exists.)
#
# go-auto-upgrade: policy skip (retested 2026-09-22 against gau v0.6.2). The
#   dependency gate now correctly suppresses import-adding rewrites (lo is not
#   in go.mod, and this minimal-dependency protocol library will not add it),
#   so a run is a green no-op that emits lo-dependency-missing + manual-Filter
#   suggestion warnings every time. Pure noise against a standing policy:
#   trivial for-range loops stay, no samber/lo dependency for zero behavioral
#   gain.
skip_steps:
  - go-structure-linter
  - eslint-check
  - eslint-fix
  - go-auto-upgrade
