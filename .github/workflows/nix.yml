name: nix

# Runs the canonical hermetic gate (`nix flake check`: three Go modules
# built/tested in isolation + treefmt format check) on GitHub runners.
# Promoted 2026-09-18 (continue-on-error dropped): 15 consecutive green
# master runs 2026-09-03 → 2026-09-18 and v0.5.0 tagged from a tree with a
# green run — see docs/ci-watch.md. The flake uses the nixpkgs `go_1_27`
# binary (cache-served, not built from source), so cold runs are mostly
# module downloads. erraudit is deliberately
# NOT part of the flake (private deps); CI's probe-gated erraudit job covers
# it instead.

on:
  push:
    branches: [main, master]
    paths:
      - "**.go"
      - "**.nix"
      - "**/go.mod"
      - "**/go.sum"
      - "go.work"
      - ".github/workflows/nix.yml"
      - "static/datastar.js"
      - "datastartest/testdata/**"
  pull_request:
    branches: [main, master]
    paths:
      - "**.go"
      - "**.nix"
      - "**/go.mod"
      - "**/go.sum"
      - "go.work"
      - ".github/workflows/nix.yml"
      - "static/datastar.js"
      - "datastartest/testdata/**"

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Nix flake check (hermetic: 3 Go modules + format)"
        run: nix flake check
