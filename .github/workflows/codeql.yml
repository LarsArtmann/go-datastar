name: codeql

on:
  push:
    branches: [main, master]
    paths:
      - "**.go"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "**.go"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "43 4 * * 1" # weekly Monday scan

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.3"

      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: go

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v3
        with:
          category: "/language:go"
