name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GOEXPERIMENT: jsonv2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./... ./datastartest/... ./static/...

      - name: Vet
        run: go vet ./... ./datastartest/... ./static/...

      - name: Test
        run: go test ./... ./datastartest/... ./static/... -race -count=1

      - name: Per-module isolation (GOWORK=off)
        run: |
          for mod in . ./datastartest ./static; do
            echo "::group::GOWORK=off build $mod"
            (cd "$mod" && GOWORK=off go build ./...)
            echo "::group::GOWORK=off test $mod"
            (cd "$mod" && GOWORK=off go test ./... -count=1)
          done

      - name: Workspace sync idempotency
        run: |
          cp go.work go.work.bak
          go work sync
          diff go.work go.work.bak && echo "go.work is idempotent" || { echo "::error::go.work changed after 'go work sync' — run locally and commit"; rm go.work.bak; exit 1; }
          rm go.work.bak

      - name: Replace directive audit
        run: |
          # No replace directive should use an absolute path
          if grep -rn 'replace.*=>/' go.mod datastartest/go.mod static/go.mod; then
            echo "::error::Found absolute path in replace directive — use relative paths only"
            exit 1
          fi
          echo "All replace directives use relative paths"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: golangci-lint run ./... ./datastartest/... ./static/... --timeout 5m

  erraudit:
    runs-on: ubuntu-latest
    continue-on-error: true # erraudit repo is private; job runs once public
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install erraudit
        run: go install github.com/larsartmann/erraudit/cmd/erraudit@v0.3.0

      - name: Error handling audit
        run: erraudit ./... ./datastartest/... ./static/... --type-aware --enforce-go-error-family --severity-threshold error

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Vulnerability scan
        run: govulncheck ./... ./datastartest/... ./static/...
