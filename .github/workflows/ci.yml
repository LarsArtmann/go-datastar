name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "**.go"
      - "**.templ"
      - "**.nix"
      - "go.mod"
      - "go.sum"
      - "datastartest/go.mod"
      - "datastartest/go.sum"
      - "static/go.mod"
      - "static/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - "flake.lock"
      - ".github/workflows/ci.yml"
      - "static/datastar.js"
      - "datastartest/testdata/**"
      - "**.golden"
  pull_request:
    branches: [main, master]
    paths:
      - "**.go"
      - "**.templ"
      - "**.nix"
      - "go.mod"
      - "go.sum"
      - "datastartest/go.mod"
      - "datastartest/go.sum"
      - "static/go.mod"
      - "static/go.sum"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - "flake.lock"
      - ".github/workflows/ci.yml"
      - "static/datastar.js"
      - "datastartest/testdata/**"
      - "**.golden"

# Docs-only changes skip this workflow entirely; actionlint.yml still runs
# on every push so workflow and doc changes always get some CI signal.

env:
  GOEXPERIMENT: jsonv2

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        module: [".", "./datastartest", "./static"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"

      - name: Build + Vet + Test (GOWORK=off, ${{ matrix.module }})
        run: |
          cd ${{ matrix.module }}
          GOWORK=off go build ./...
          GOWORK=off go vet ./...
          GOWORK=off go test ./... -race -count=1

      - name: go mod verify (${{ matrix.module }})
        run: (cd ${{ matrix.module }} && GOWORK=off go mod verify)

      - name: Tidy check (${{ matrix.module }})
        run: (cd ${{ matrix.module }} && GOWORK=off go mod tidy -diff)

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"

      - name: Workspace build + vet + test (race)
        run: |
          go build ./... ./datastartest/... ./static/...
          go vet ./... ./datastartest/... ./static/...
          go test ./... ./datastartest/... ./static/... -race -count=1

      - name: go.work use-vs-disk check
        run: |
          cp go.work go.work.use-check.bak
          go work use . ./datastartest ./static
          if ! diff go.work.use-check.bak go.work; then
            echo "::error::committed go.work diverges from 'go work use . ./datastartest ./static' — run 'go work use' locally and commit"
            exit 1
          fi
          echo "go.work matches 'go work use' output"

      - name: Workspace sync idempotency
        run: |
          cp go.work go.work.bak
          go work sync
          diff go.work go.work.bak; rc=$?
          rm -f go.work.bak
          if [ "$rc" -eq 0 ]; then
            echo "go.work is idempotent"
          elif [ "$rc" -eq 1 ]; then
            echo "::error::go.work changed after 'go work sync' — run locally and commit"
            exit 1
          else
            echo "::error::diff exited with code $rc (trouble)"
            exit 1
          fi

      - name: Replace directive audit
        run: |
          # No replace directive should use an absolute path
          if grep -rn 'replace.*=>/' go.mod datastartest/go.mod static/go.mod; then
            echo "::error::Found absolute path in replace directive — use relative paths only"
            exit 1
          fi
          echo "All replace directives use relative paths"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"

      # golangci-lint's analysis cache is the lint job's long pole (1m33s cold).
      # setup-go already caches the Go build/module caches (so `go install`
      # of the linter is warm); this adds the linter's own analysis cache.
      - name: Cache golangci-lint analysis
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-v2.12.2-go1.26.7-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-v2.12.2-go1.26.7-

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        run: golangci-lint run ./... ./datastartest/... ./static/... --timeout 5m

  erraudit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"

      - name: Probe erraudit availability
        id: probe
        run: |
          if go list -m github.com/larsartmann/erraudit@v0.3.0 >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::erraudit repo is private; skipping error-handling audit until it goes public"
          fi

      - name: Install erraudit
        if: steps.probe.outputs.available == 'true'
        run: go install github.com/larsartmann/erraudit/cmd/erraudit@v0.3.0

      - name: Error handling audit
        if: steps.probe.outputs.available == 'true'
        run: |
          for mod in . ./datastartest ./static; do
            echo "::group::erraudit $mod"
            (cd "$mod" && erraudit . --type-aware --enforce-go-error-family --severity-threshold error)
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Vulnerability scan
        run: govulncheck ./... ./datastartest/... ./static/...
