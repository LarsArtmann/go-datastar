name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOEXPERIMENT: jsonv2
          GOWORK: off
        run: go build ./...

      - name: Vet
        env:
          GOEXPERIMENT: jsonv2
          GOWORK: off
        run: go vet ./...

      - name: Test
        env:
          GOEXPERIMENT: jsonv2
          GOWORK: off
        run: go test ./... -race -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install golangci-lint
        env:
          GOEXPERIMENT: jsonv2
          GOWORK: off
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint
        env:
          GOEXPERIMENT: jsonv2
          GOWORK: off
        run: golangci-lint run ./... --timeout 5m
