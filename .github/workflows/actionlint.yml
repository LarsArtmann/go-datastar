name: actionlint

# Workflow YAML is validated on EVERY push and PR regardless of which
# files changed: a bad workflow edit must never redden master silently,
# and docs-only pushes (which skip the code gates in ci.yml via its
# paths filter) still get this signal.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.7"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint workflows
        run: actionlint
